<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2432">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icone-192.png">
<title>Painel</title>
<style>
  :root{
    --ink:#1B2432; --ink-2:#232E40; --ink-3:#2C3950; --line:#39465E;
    --paper:#EDEAE3; --muted:#94A0B5;
    --in:#4FB286; --out:#DB4F63; --due:#E9C46A; --credito:#C77DFF;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink)}
  body{color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.45;
    padding-bottom:calc(152px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:contain}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  :focus-visible{outline:2px solid var(--due);outline-offset:2px;border-radius:4px}
  .num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  header{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--ink)}
  .mes{font-size:17px;font-weight:600;text-transform:capitalize;white-space:nowrap}
  .mes small{display:block;font-weight:400;font-size:12px;color:var(--muted);text-transform:none}
  .navbtn{width:34px;height:34px;flex:0 0 34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted)}
  .spacer{flex:1}
  .sinc{width:7px;height:7px;border-radius:99px;background:var(--muted);flex:0 0 7px}
  .sinc.on{background:var(--in)} .sinc.off{background:var(--due)} .sinc.erro{background:var(--out)}

  main{padding:var(--pad)}
  section[hidden]{display:none}
  h2{font-size:12px;font-weight:600;color:var(--muted);margin:26px 0 10px}
  h2:first-child{margin-top:0}
  .aviso{border:1px solid var(--out);border-left-width:3px;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#FFD9DD;margin:14px 0;line-height:1.5}
  .aviso.ok{border-color:var(--in);color:#CBEDDD}
  .aviso.atencao{border-color:var(--due);color:#F6E7BD}

  .hero .label{font-size:13px;color:var(--muted)}
  .hero .big{font-family:var(--serif);font-size:clamp(38px,13vw,54px);line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .hero .big.neg{color:var(--out)} .hero .big.zero{color:var(--in)}
  .hero .sub{font-size:13px;color:var(--muted)}

  .gauge{height:12px;border-radius:99px;background:var(--ink-3);margin:16px 0 10px;overflow:hidden;display:flex}
  .gauge i{display:block;height:100%}
  .gauge i.usado{background:var(--credito)} .gauge i.reservado{background:var(--credito);opacity:.35}
  .gauge.fds i.usado{background:var(--out)} .gauge.fds i.reservado{background:var(--in);opacity:.5}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .kpi{border:1px solid var(--line);border-radius:13px;padding:12px}
  .kpi .k{font-size:12px;color:var(--muted);margin-bottom:4px}
  .kpi .v{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:21px;line-height:1.1}
  .kpi .v.neg{color:var(--out)} .kpi .n{font-size:11.5px;color:var(--muted);margin-top:3px}

  .contas{border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .conta{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border-bottom:1px solid var(--ink-3);font-size:14px}
  .conta:last-child{border-bottom:0}
  .conta.total{background:var(--ink-2);font-weight:600}
  .conta .cv{font-family:var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
  .conta .cv.neg{color:var(--out)} .conta .cv.pos{color:var(--in)}
  .conta small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}

  .cat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--ink-3)}
  .cat:last-child{border-bottom:0}
  .cat .val{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:15px}
  .cat .bar{grid-column:1/-1;height:4px;border-radius:99px;background:var(--ink-3);overflow:hidden}
  .cat .bar i{display:block;height:100%;background:var(--out);opacity:.8}

  .item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--ink-3)}
  .item:last-child{border-bottom:0}
  .item .body{flex:1;min-width:0}
  .item .t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m{font-size:12px;color:var(--muted);margin-top:2px}
  .item .v{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
  .item .v.in{color:var(--in)}
  .item .x{color:var(--muted);padding:2px 4px;font-size:16px;line-height:1}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
  .tag.cred{border-color:var(--credito);color:var(--credito)}

  .check{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--line);border-radius:7px;margin-top:2px;display:grid;place-items:center;font-size:13px;color:transparent}
  .check.on{background:var(--in);border-color:var(--in);color:var(--ink)}
  .feito .t{text-decoration:line-through;color:var(--muted)}
  .atrasado .m{color:var(--out)}
  .hora{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:15px;color:var(--due);flex:0 0 46px;margin-top:1px}

  .grupo{font-size:12px;color:var(--muted);margin:22px 0 4px;display:flex;align-items:center;gap:8px}
  .grupo:first-child{margin-top:0}
  .grupo::after{content:"";flex:1;height:1px;background:var(--ink-3)}
  .vazio{color:var(--muted);font-size:14px;padding:16px 0;line-height:1.5}
  .vazio b{color:var(--paper);font-weight:500}

  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(to bottom,rgba(27,36,50,.85),var(--ink) 22%);
    padding:10px var(--pad) calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .campo{display:flex;gap:8px;align-items:flex-end}
  .campo textarea{flex:1;background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
    border-radius:14px;padding:11px 13px;resize:none;max-height:110px;line-height:1.35}
  .campo textarea::placeholder{color:var(--muted)}
  .enviar{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-weight:700}
  .enviar:disabled{opacity:.4}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{flex:1;padding:9px 4px;border-radius:11px;font-size:13px;color:var(--muted);border:1px solid transparent}
  .tabs button[aria-current="true"]{background:var(--ink-2);color:var(--paper);border-color:var(--line)}
  .tabs .bolha{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;background:var(--due);color:var(--ink);border-radius:99px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

  .log{max-height:42vh;overflow-y:auto;margin:0 0 10px;display:flex;flex-direction:column;gap:8px}
  .log[hidden]{display:none}
  .msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap}
  .msg.eu{align-self:flex-end;background:var(--ink-3);border-bottom-right-radius:5px}
  .msg.ia{align-self:flex-start;background:var(--ink-2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.erro{border-color:var(--out);color:#FFD9DD}
  .pensando{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 2px}
  .pensando i{display:inline-block;width:5px;height:5px;border-radius:99px;background:var(--muted);margin-right:3px;animation:p 1.1s infinite}
  .pensando i:nth-child(2){animation-delay:.15s} .pensando i:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  .limpar{align-self:center;font-size:12px;color:var(--muted);padding:2px 8px}

  .modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,28,.72);display:grid;place-items:end center;overflow-y:auto}
  .modal[hidden]{display:none}
  .folha{width:100%;max-width:520px;background:var(--ink-2);border:1px solid var(--line);border-bottom:0;
    border-radius:20px 20px 0 0;padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom))}
  .folha h3{margin:0 0 14px;font-size:16px;font-weight:600}
  .linha{display:flex;gap:10px;margin-bottom:10px}
  .fld{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld label{font-size:12px;color:var(--muted)}
  .fld input,.fld select{background:var(--ink);border:1px solid var(--line);color:var(--paper);border-radius:11px;padding:10px 11px;width:100%}
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;font-size:14px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--ink-3);color:var(--paper)}
  .acoes{display:flex;gap:10px;margin-top:6px}
  .acoes .prim{flex:1;background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;font-weight:600}
  .acoes .sec{border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--muted)}
  .fixa{display:flex;gap:8px;margin-bottom:8px}
  .fixa input:first-child{flex:1} .fixa input:nth-child(2){width:100px}
  .fixa button{color:var(--muted);padding:0 6px}
  .addfixa{font-size:13px;color:var(--due);padding:4px 0}
  .rodape{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.6}
  .rodape button{color:var(--due);font-size:12.5px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));z-index:70;
    background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:88vw}
  .toast[hidden]{display:none}

  .porta{position:fixed;inset:0;z-index:90;background:var(--ink);display:grid;place-items:center;padding:32px var(--pad);text-align:left}
  .porta[hidden]{display:none}
  .porta .cx{max-width:340px}
  .porta h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 10px;line-height:1.15}
  .porta p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.55}
  .porta button{width:100%;background:var(--paper);color:var(--ink);border-radius:13px;padding:13px;font-weight:600}
  .porta .alt{background:none;color:var(--muted);font-weight:400;margin-top:10px;font-size:13px}

  @media (min-width:640px){
    body{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
    .barra{max-width:560px;left:50%;transform:translateX(-50%)}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="porta" id="porta" hidden>
  <div class="cx">
    <h1 id="portaTit">Seu painel</h1>
    <p id="portaTxt">Entre com sua conta Google para os dados sincronizarem entre o celular e o computador.</p>
    <button id="btnEntrar">Entrar com Google</button>
    <button class="alt" id="btnLocal">Usar só neste aparelho</button>
  </div>
</div>

<header>
  <button class="navbtn" id="prevMes" aria-label="Mês anterior">‹</button>
  <div class="mes" id="mesLabel">—<small id="mesSub"></small></div>
  <div class="spacer"></div>
  <span class="sinc" id="sinc" title="sincronização"></span>
  <button class="navbtn" id="nextMes" aria-label="Próximo mês">›</button>
  <button class="navbtn" id="btnNovo" aria-label="Novo registro">+</button>
  <button class="navbtn" id="btnCfg" aria-label="Ajustes">⚙</button>
</header>

<main>
  <section id="v-hoje">
    <div class="hero">
      <div class="label" id="hLabel">—</div>
      <div class="big num" id="hValor">R$ 0,00</div>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="gauge fds" id="hGauge"><i class="usado" style="width:0%"></i><i class="reservado" style="width:0%"></i></div>
    <div id="hAviso"></div>
    <div class="kpis">
      <div class="kpi"><div class="k">Limite livre no PicPay</div><div class="v num" id="kLimite">—</div><div class="n" id="kLimiteN"></div></div>
      <div class="kpi"><div class="k">Dias sem gastar</div><div class="v num" id="kStreak">—</div><div class="n" id="kStreakN"></div></div>
    </div>
    <h2>Hoje e amanhã</h2>
    <div id="hAgenda"></div>
  </section>

  <section id="v-mes" hidden>
    <div class="hero">
      <div class="label">Compromete do próximo salário</div>
      <div class="big num" id="mValor">R$ 0,00</div>
      <div class="sub" id="mSub"></div>
    </div>
    <div class="gauge" id="mGauge"><i class="usado" style="width:0%"></i><i class="reservado" style="width:0%"></i></div>
    <h2 id="mTituloProj">Projeção</h2>
    <div class="contas" id="mProjecao"></div>
    <div id="mAviso"></div>
    <h2>Para onde foi</h2>
    <div id="mCat"></div>
    <h2>Fins de semana</h2>
    <div class="contas" id="mFds"></div>
    <h2>Lançamentos do mês</h2>
    <div id="mLista"></div>
  </section>

  <section id="v-agenda" hidden>
    <div id="aLista"></div>
  </section>
</main>

<div class="barra">
  <div class="log" id="log" hidden></div>
  <div class="campo">
    <textarea id="entrada" rows="1" placeholder="ifood 38 no picpay · amanhã 9h reunião"></textarea>
    <button class="enviar" id="btnEnviar" aria-label="Registrar">↑</button>
  </div>
  <div class="tabs">
    <button data-view="hoje" aria-current="true">Hoje</button>
    <button data-view="mes">Mês</button>
    <button data-view="agenda">Agenda<span class="bolha" id="bolha" hidden>0</span></button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="fTit">
    <h3 id="fTit">Novo registro</h3>
    <div class="seg" id="segTipo">
      <button data-tipo="despesa" aria-pressed="true">Gasto</button>
      <button data-tipo="receita" aria-pressed="false">Entrada</button>
      <button data-tipo="pendencia" aria-pressed="false">Pendência</button>
    </div>
    <div id="campFin">
      <div class="linha">
        <div class="fld"><label for="fValor">Valor</label><input id="fValor" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></div>
        <div class="fld"><label for="fData">Data</label><input id="fData" type="date"></div>
      </div>
      <div class="linha"><div class="fld"><label for="fDesc">Descrição</label><input id="fDesc" type="text" placeholder="ifood, uber, cinema…"></div></div>
      <div class="linha">
        <div class="fld"><label for="fCat">Categoria</label><select id="fCat"></select></div>
        <div class="fld" id="wrapMet"><label for="fMet">Pago com</label>
          <select id="fMet"><option value="picpay">PicPay (crédito)</option><option value="conta">Conta / Pix</option></select></div>
      </div>
    </div>
    <div id="campPend" hidden>
      <div class="linha"><div class="fld"><label for="pTitulo">O quê</label><input id="pTitulo" type="text" placeholder="Reunião com…"></div></div>
      <div class="linha">
        <div class="fld"><label for="pData">Data</label><input id="pData" type="date"></div>
        <div class="fld"><label for="pHora">Hora</label><input id="pHora" type="time"></div>
      </div>
    </div>
    <div class="acoes">
      <button class="prim" id="btnSalvar">Salvar</button>
      <button class="sec" id="btnCancelar">Cancelar</button>
    </div>
  </div>
</div>

<div class="modal" id="modalCfg" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="cTit">
    <h3 id="cTit">Ajustes</h3>
    <div class="linha">
      <div class="fld"><label for="cSalario">Salário líquido</label><input id="cSalario" type="number" step="0.01"></div>
      <div class="fld"><label for="cLimite">Limite do PicPay</label><input id="cLimite" type="number" step="0.01"></div>
    </div>
    <div class="linha">
      <div class="fld"><label for="cTeto">Teto por fim de semana</label><input id="cTeto" type="number" step="0.01"></div>
      <div class="fld"><label for="cSexta">Sexta conta como FDS</label>
        <select id="cSexta"><option value="nao">Não</option><option value="sim">Sim</option></select></div>
    </div>
    <label style="font-size:12px;color:var(--muted);display:block;margin:14px 0 8px">Já comprometido no próximo salário</label>
    <div id="cFixas"></div>
    <button class="addfixa" id="cAdd">+ adicionar item</button>
    <div class="acoes">
      <button class="prim" id="cSalvar">Salvar ajustes</button>
      <button class="sec" id="cFechar">Fechar</button>
    </div>
    <div class="rodape">
      <div id="cConta">—</div>
      <div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">
        <button id="cExportar">Baixar backup</button>
        <button id="cImportar">Restaurar backup</button>
        <button id="cSair">Sair da conta</button>
      </div>
      <input type="file" id="cArquivo" accept="application/json" hidden>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO — preencha antes de publicar (veja o README)
   ===================================================================== */
const CONFIG = {
  firebase: {
    apiKey:            "COLE_AQUI",
    authDomain:        "SEU-PROJETO.firebaseapp.com",
    projectId:         "SEU-PROJETO",
    appId:             "COLE_AQUI"
  },
  groq: {
    key:   "COLE_AQUI",
    model: "llama-3.3-70b-versatile"
  }
};

/* ===================== constantes ===================== */
const CAT_DESPESA = ['Alimentação','iFood','Mercado','Transporte','Lazer','Nicolly','Contas','Assinaturas','Saúde','Outros'];
const CAT_RECEITA = ['Salário','Freela','Reembolso','Rendimento','Outros'];
const CFG_PADRAO = {
  salario: 2875, limite: 1350, tetoFds: 250, sextaNoFds: false, metodoPadrao: 'picpay',
  comprometido: [ {nome:'Dívida', valor:255}, {nome:'Guardar', valor:300} ]
};
const CHAVE_LOCAL = 'painel:local';

let state = { cfg:{...CFG_PADRAO}, lancamentos:[], pendencias:[], chat:[] };
let mesRef = hojeISO().slice(0,7);
let viewAtual = 'hoje';
let tipoModal = 'despesa';

/* ===================== datas ===================== */
function hojeISO(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function doISO(s){ const [a,m,d]=s.split('-').map(Number); return new Date(a,m-1,d); }
function somaDias(s,n){ const d=doISO(s); d.setDate(d.getDate()+n); return iso(d); }
function nomeMes(ym){ const [a,m]=ym.split('-').map(Number); return new Date(a,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function mesCurto(ym){ const [a,m]=ym.split('-').map(Number); return new Date(a,m-1,1).toLocaleDateString('pt-BR',{month:'long'}); }
function diaCurto(s){ return doISO(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.',''); }
function diaSemana(s){ return doISO(s).toLocaleDateString('pt-BR',{weekday:'long'}); }
function diasNoMes(ym){ const [a,m]=ym.split('-').map(Number); return new Date(a,m,0).getDate(); }
function proxMes(ym){ const [a,m]=ym.split('-').map(Number); const d=new Date(a,m,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mudaMes(ym,n){ const [a,m]=ym.split('-').map(Number); const d=new Date(a,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
const brl  = v => (v<0?'-':'')+'R$ '+Math.abs(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0 = v => (v<0?'-':'')+'R$ '+Math.round(Math.abs(Number(v)||0)).toLocaleString('pt-BR');
const uid  = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc  = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fdsDe(dataISO){
  const dow = doISO(dataISO).getDay();
  const inicioDow = state.cfg.sextaNoFds ? 5 : 6;
  if(dow === 0) return { ini: somaDias(dataISO, state.cfg.sextaNoFds ? -2 : -1), fim: dataISO };
  if(dow === 6) return { ini: state.cfg.sextaNoFds ? somaDias(dataISO,-1) : dataISO, fim: somaDias(dataISO,1) };
  if(dow === 5 && state.cfg.sextaNoFds) return { ini: dataISO, fim: somaDias(dataISO,2) };
  const ini = somaDias(dataISO, inicioDow - dow);
  return { ini, fim: somaDias(ini, state.cfg.sextaNoFds ? 2 : 1) };
}
function fdsDoMes(ym){
  const total = diasNoMes(ym), lista = [];
  for(let d=1; d<=total; d++){
    const data = ym+'-'+String(d).padStart(2,'0');
    if(doISO(data).getDay() === 6){ const f = fdsDe(data); lista.push({ini:f.ini, fim:f.fim}); }
  }
  return lista;
}
const noIntervalo = (data,ini,fim) => data >= ini && data <= fim;

/* ===================== cálculos ===================== */
const doMes = ym => state.lancamentos.filter(l => l.data.startsWith(ym));
function resumo(ym){
  const l = doMes(ym);
  const entra = l.filter(x=>x.tipo==='receita').reduce((s,x)=>s+x.valor,0);
  const sai   = l.filter(x=>x.tipo==='despesa').reduce((s,x)=>s+x.valor,0);
  const credito = l.filter(x=>x.tipo==='despesa' && x.metodo==='picpay').reduce((s,x)=>s+x.valor,0);
  return { entra, sai, credito, conta: sai-credito };
}
function porCategoria(ym){
  const m = {};
  doMes(ym).filter(x=>x.tipo==='despesa').forEach(x=>{ const c=x.categoria||'Outros'; m[c]=(m[c]||0)+x.valor; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
const gastoNoFds = f => state.lancamentos.filter(x=>x.tipo==='despesa' && noIntervalo(x.data,f.ini,f.fim)).reduce((s,x)=>s+x.valor,0);
const gastoNoDia = d => state.lancamentos.filter(x=>x.tipo==='despesa' && x.data===d).reduce((s,x)=>s+x.valor,0);
function ehFds(d){ const dow=doISO(d).getDay(); return dow===0||dow===6||(state.cfg.sextaNoFds && dow===5); }
function streakLimpo(){
  let n=0, d=hojeISO();
  if(gastoNoDia(d)>0) return 0;
  while(gastoNoDia(d)===0 && n<400){ n++; d=somaDias(d,-1); }
  return n;
}
const comprometidoTotal = () => (state.cfg.comprometido||[]).reduce((s,x)=>s+(Number(x.valor)||0),0);
function projecao(ym){
  const r = resumo(ym), comp = comprometidoTotal();
  return { salario: state.cfg.salario, fatura: r.credito, comp, livre: state.cfg.salario - r.credito - comp };
}
const fdsRestantes = ym => fdsDoMes(ym).filter(f => f.fim >= hojeISO());
const orcamentoRestante = ym => fdsRestantes(ym).reduce((s,f)=> s + Math.max(0, state.cfg.tetoFds - gastoNoFds(f)), 0);
const pendenciasAbertas = () => state.pendencias.filter(p=>!p.feito)
  .sort((a,b)=> (a.data+(a.hora||'99:99')).localeCompare(b.data+(b.hora||'99:99')));

/* =====================================================================
   camada de dados: Firestore quando logado, localStorage quando não
   ===================================================================== */
let modo = 'indefinido';           // 'nuvem' | 'local'
let db = null, auth = null, user = null, docRef = null, ignorarSnapshot = false;
const elSinc = document.getElementById('sinc');
const setSinc = (c,t) => { elSinc.className = 'sinc '+c; elSinc.title = t; };

async function iniciar(){
  const configurado = CONFIG.firebase.apiKey && !CONFIG.firebase.apiKey.startsWith('COLE');
  if(!configurado){ entrarLocal('Firebase não configurado — rodando só neste aparelho.'); return; }
  try{
    const [{ initializeApp }, fbAuth, fbStore] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app = initializeApp(CONFIG.firebase);
    auth = fbAuth.getAuth(app);
    db = fbStore.initializeFirestore(app, { localCache: fbStore.persistentLocalCache({ tabManager: fbStore.persistentSingleTabManager() }) });
    window._fb = { ...fbAuth, ...fbStore };

    const redir = await fbAuth.getRedirectResult(auth).catch(()=>null);
    void redir;

    fbAuth.onAuthStateChanged(auth, async u => {
      if(u){
        user = u; modo = 'nuvem';
        docRef = fbStore.doc(db, 'painel', u.uid);
        document.getElementById('porta').hidden = true;
        setSinc('on','sincronizado');
        fbStore.onSnapshot(docRef, snap => {
          if(ignorarSnapshot) return;
          if(snap.exists()){ aplicarDoc(snap.data()); }
          else { salvarAgora(); }
          render(); renderChat();
        }, () => setSinc('erro','erro de sincronização'));
      } else if(modo !== 'local'){
        document.getElementById('porta').hidden = false;
      }
    });
  }catch(e){
    entrarLocal('Não deu para carregar o Firebase. Rodando só neste aparelho.');
  }
}
function aplicarDoc(d){
  state.cfg = {...CFG_PADRAO, ...(d.cfg||{})};
  state.lancamentos = d.lancamentos || [];
  state.pendencias  = d.pendencias  || [];
  state.chat        = d.chat        || [];
}
function entrarLocal(msg){
  modo = 'local';
  document.getElementById('porta').hidden = true;
  setSinc('off','só neste aparelho');
  try{
    const raw = localStorage.getItem(CHAVE_LOCAL);
    if(raw) aplicarDoc(JSON.parse(raw));
  }catch(e){}
  if(msg) toast(msg);
  render(); renderChat();
}

let tSalvar;
function salvar(){ clearTimeout(tSalvar); tSalvar = setTimeout(salvarAgora, 400); }
async function salvarAgora(){
  state.chat = state.chat.slice(-40);
  const payload = { cfg:state.cfg, lancamentos:state.lancamentos, pendencias:state.pendencias, chat:state.chat, atualizadoEm: Date.now() };
  if(modo === 'nuvem' && docRef){
    ignorarSnapshot = true;
    try{
      await window._fb.setDoc(docRef, payload);
      setSinc('on','sincronizado');
    }catch(e){ setSinc('erro','offline — salva quando voltar'); }
    finally{ setTimeout(()=>{ ignorarSnapshot = false; }, 300); }
  } else {
    try{ localStorage.setItem(CHAVE_LOCAL, JSON.stringify(payload)); }
    catch(e){ toast('Não deu para salvar neste aparelho.'); }
  }
}

document.getElementById('btnEntrar').onclick = async ()=>{
  try{
    const p = new window._fb.GoogleAuthProvider();
    try{ await window._fb.signInWithPopup(auth, p); }
    catch(e){ await window._fb.signInWithRedirect(auth, p); }
  }catch(e){ toast('Não foi possível entrar. Tente "usar só neste aparelho".'); }
};
document.getElementById('btnLocal').onclick = ()=> entrarLocal();
document.getElementById('cSair').onclick = async ()=>{
  if(auth && user){ await window._fb.signOut(auth); location.reload(); }
  else toast('Você não está logado.');
};

/* ===================== render ===================== */
function render(){
  document.getElementById('mesLabel').firstChild.nodeValue = nomeMes(mesRef);
  document.getElementById('mesSub').textContent = mesRef === hojeISO().slice(0,7) ? 'mês atual' : '';
  renderHoje(); renderMes(); renderAgenda();
  const atrasadas = pendenciasAbertas().filter(p=>p.data <= hojeISO()).length;
  const b = document.getElementById('bolha');
  b.hidden = atrasadas === 0; b.textContent = atrasadas;
}

function renderHoje(){
  const hoje = hojeISO(), ym = hoje.slice(0,7), f = fdsDe(hoje);
  const gasto = gastoNoFds(f), teto = state.cfg.tetoFds, r = resumo(ym);
  const limiteLivre = state.cfg.limite - r.credito;
  const hv = document.getElementById('hValor'), g = document.getElementById('hGauge');

  if(ehFds(hoje)){
    const resta = teto - gasto;
    document.getElementById('hLabel').textContent = 'Resta neste fim de semana';
    hv.textContent = brl(resta); hv.className = 'big num' + (resta<0?' neg':'');
    document.getElementById('hSub').textContent = 'Já gastou '+brl(gasto)+' de '+brl(teto)+' · até '+diaCurto(f.fim);
    g.children[0].style.width = Math.min(100, gasto/teto*100)+'%';
    g.children[1].style.width = Math.max(0, 100 - gasto/teto*100)+'%';
  } else {
    const g0 = gastoNoDia(hoje);
    document.getElementById('hLabel').textContent = g0>0 ? 'Gasto hoje (meta era zero)' : 'Gasto hoje';
    hv.textContent = brl(g0); hv.className = 'big num' + (g0>0?' neg':' zero');
    document.getElementById('hSub').textContent = 'Meio de semana é dia de não gastar. Próximo fim de semana: '
      + diaCurto(f.ini)+' a '+diaCurto(f.fim)+', '+brl(Math.max(0, teto-gastoNoFds(f)))+' liberados.';
    g.children[0].style.width='0%'; g.children[1].style.width='0%';
  }

  document.getElementById('kLimite').textContent = brl0(limiteLivre);
  document.getElementById('kLimite').className = 'v num'+(limiteLivre<=0?' neg':'');
  document.getElementById('kLimiteN').textContent = 'de '+brl0(state.cfg.limite)+' · usou '+brl0(r.credito);
  const st = streakLimpo();
  document.getElementById('kStreak').textContent = st;
  document.getElementById('kStreakN').textContent = st===0 ? 'você gastou hoje' : (st===1 ? 'só hoje até agora' : 'seguidos, contando hoje');

  const orc = orcamentoRestante(ym), el = document.getElementById('hAviso');
  if(limiteLivre < 0){
    el.innerHTML = '<div class="aviso">Você passou do limite do PicPay em '+brl(-limiteLivre)+'. Pare de usar o cartão até o próximo salário.</div>';
  } else if(orc > limiteLivre){
    el.innerHTML = '<div class="aviso atencao">Seu plano de fim de semana pede '+brl0(orc)+' até o fim do mês, mas o limite livre é '+brl0(limiteLivre)+'. Faltam '+brl0(orc-limiteLivre)+'.</div>';
  } else {
    el.innerHTML = '<div class="aviso ok">No plano: '+brl0(orc)+' reservados para os '+fdsRestantes(ym).length+' fins de semana que faltam, dentro do limite livre.</div>';
  }

  const ag = document.getElementById('hAgenda');
  const foco = pendenciasAbertas().filter(p => p.data <= somaDias(hoje,1));
  const lista = foco.length ? foco : pendenciasAbertas().slice(0,3);
  ag.innerHTML = lista.length ? lista.map(itemPend).join('')
    : '<div class="vazio">Nada marcado. Escreva <b>amanhã 9h reunião</b> no campo abaixo.</div>';
  ligarPend(ag);
}

function renderMes(){
  const r = resumo(mesRef), p = projecao(mesRef), total = r.credito + p.comp;
  const mv = document.getElementById('mValor');
  mv.textContent = brl(total); mv.className = 'big num'+(total>state.cfg.salario?' neg':'');
  document.getElementById('mSub').textContent = brl0(r.credito)+' de fatura + '+brl0(p.comp)+' já comprometidos';

  const g = document.getElementById('mGauge'), base = Math.max(state.cfg.salario, total, 1);
  g.children[0].style.width = Math.min(100, r.credito/base*100)+'%';
  g.children[1].style.width = Math.min(100 - r.credito/base*100, p.comp/base*100)+'%';

  document.getElementById('mTituloProj').textContent = 'Projeção do salário de '+mesCurto(proxMes(mesRef));
  const linhas = [
    ['Salário', p.salario, 'pos', 'entra no primeiro dia útil'],
    ['Fatura do PicPay', -p.fatura, 'neg', 'o que já foi no crédito este mês']
  ];
  (state.cfg.comprometido||[]).forEach(c => linhas.push([c.nome, -(Number(c.valor)||0), 'neg', '']));
  document.getElementById('mProjecao').innerHTML =
    linhas.map(([n,v,cls,nota]) => `<div class="conta"><div>${esc(n)}${nota?`<small>${esc(nota)}</small>`:''}</div><div class="cv ${cls}">${brl(v)}</div></div>`).join('')
    + `<div class="conta total"><div>Livre para as contas de ${esc(mesCurto(proxMes(mesRef)))}</div><div class="cv ${p.livre<0?'neg':''}">${brl(p.livre)}</div></div>`;

  const orc = orcamentoRestante(mesRef), projFinal = p.livre - orc;
  document.getElementById('mAviso').innerHTML = '<div class="aviso '+(projFinal<0?'':'atencao')+'">Gastando tudo que planejou nos fins de semana que faltam ('
    +brl0(orc)+'), sobra '+brl0(projFinal)+' do salário de '+mesCurto(proxMes(mesRef))+' para as contas do mês.</div>';

  const cats = porCategoria(mesRef), elc = document.getElementById('mCat');
  if(!cats.length){ elc.innerHTML = '<div class="vazio">Sem gastos registrados.</div>'; }
  else{
    const max = cats[0][1];
    elc.innerHTML = cats.map(([n,v])=>`<div class="cat"><div class="nome">${esc(n)}</div><div class="val">${brl(v)}</div>
      <div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join('');
  }

  const hoje = hojeISO();
  document.getElementById('mFds').innerHTML = fdsDoMes(mesRef).map(f=>{
    const gs = gastoNoFds(f), pass = f.fim < hoje, atual = noIntervalo(hoje,f.ini,f.fim);
    const cls = gs > state.cfg.tetoFds ? 'neg' : (pass ? 'pos' : '');
    return `<div class="conta"><div>${diaCurto(f.ini)} a ${diaCurto(f.fim)}<small>${atual?'este fim de semana':(pass?'':'ainda vem')} · teto ${brl0(state.cfg.tetoFds)}</small></div><div class="cv ${cls}">${brl(gs)}</div></div>`;
  }).join('');

  const l = doMes(mesRef).slice().sort((a,b)=> b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
  const el = document.getElementById('mLista');
  if(!l.length){ el.innerHTML = '<div class="vazio">Nada em '+nomeMes(mesRef)+'. Escreva <b>ifood 38</b> no campo abaixo.</div>'; }
  else{
    let html='', dia='';
    l.forEach(x=>{ if(x.data!==dia){ dia=x.data; html+=`<div class="grupo">${diaCurto(x.data)}, ${diaSemana(x.data)}</div>`; } html+=itemLanc(x); });
    el.innerHTML = html;
  }
  ligarLanc(el);
}

function renderAgenda(){
  const el = document.getElementById('aLista');
  const abertas = pendenciasAbertas();
  const feitas = state.pendencias.filter(p=>p.feito).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,15);
  if(!abertas.length && !feitas.length){ el.innerHTML = '<div class="vazio">Agenda vazia.</div>'; return; }
  const hoje = hojeISO(), amanha = somaDias(hoje,1), sem = somaDias(hoje,7);
  const grupos = [
    ['Atrasado', abertas.filter(p=>p.data<hoje)],
    ['Hoje', abertas.filter(p=>p.data===hoje)],
    ['Amanhã', abertas.filter(p=>p.data===amanha)],
    ['Próximos 7 dias', abertas.filter(p=>p.data>amanha && p.data<=sem)],
    ['Mais adiante', abertas.filter(p=>p.data>sem)],
    ['Concluído', feitas]
  ];
  el.innerHTML = grupos.filter(([,l])=>l.length).map(([t,l])=>`<div class="grupo">${t}</div>`+l.map(itemPend).join('')).join('');
  ligarPend(el);
}

function itemLanc(x){
  const cred = x.tipo==='despesa' && x.metodo==='picpay';
  return `<div class="item">
    <div class="body"><div class="t">${esc(x.descricao || x.categoria || 'Lançamento')}</div>
      <div class="m">${esc(x.categoria||'')}${cred?'<span class="tag cred">PicPay</span>':(x.tipo==='despesa'?'<span class="tag">conta</span>':'')}</div></div>
    <div class="v ${x.tipo==='receita'?'in':''}">${x.tipo==='receita'?'+':'−'} ${brl(x.valor).replace('R$ ','')}</div>
    <button class="x" data-del="${x.id}" aria-label="Excluir">×</button></div>`;
}
function itemPend(p){
  const atras = !p.feito && p.data < hojeISO(), hoje = p.data === hojeISO();
  return `<div class="item ${p.feito?'feito':''} ${atras?'atrasado':''}">
    <button class="check ${p.feito?'on':''}" data-check="${p.id}" aria-label="Concluir">✓</button>
    <div class="hora">${p.hora||'—'}</div>
    <div class="body"><div class="t">${esc(p.titulo)}</div>
      <div class="m">${atras?'atrasado desde '+diaCurto(p.data):(hoje?'hoje':diaCurto(p.data)+', '+diaSemana(p.data))}</div></div>
    <button class="x" data-delp="${p.id}" aria-label="Excluir">×</button></div>`;
}
function ligarLanc(root){
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    state.lancamentos = state.lancamentos.filter(x=>x.id!==b.dataset.del); salvar(); render(); toast('Excluído');
  });
}
function ligarPend(root){
  root.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{
    const p = state.pendencias.find(x=>x.id===b.dataset.check);
    if(p){ p.feito=!p.feito; salvar(); render(); toast(p.feito?'Concluído':'Reaberto'); }
  });
  root.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{
    state.pendencias = state.pendencias.filter(x=>x.id!==b.dataset.delp); salvar(); render(); toast('Excluído');
  });
}

/* ===================== navegação ===================== */
document.getElementById('prevMes').onclick = ()=>{ mesRef = mudaMes(mesRef,-1); render(); };
document.getElementById('nextMes').onclick = ()=>{ mesRef = mudaMes(mesRef, 1); render(); };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  viewAtual = b.dataset.view;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-current', String(x===b)));
  ['hoje','mes','agenda'].forEach(v=>document.getElementById('v-'+v).hidden = v!==viewAtual);
  window.scrollTo({top:0});
});

/* ===================== modal registro ===================== */
document.getElementById('btnNovo').onclick = ()=> abrirModal('despesa');
document.getElementById('btnCancelar').onclick = ()=> document.getElementById('modal').hidden = true;
document.getElementById('modal').onclick = e => { if(e.target.id==='modal') e.target.hidden = true; };
document.querySelectorAll('#segTipo button').forEach(b=>b.onclick=()=>setTipo(b.dataset.tipo));
function setTipo(t){
  tipoModal = t;
  document.querySelectorAll('#segTipo button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.tipo===t)));
  document.getElementById('campFin').hidden = t==='pendencia';
  document.getElementById('campPend').hidden = t!=='pendencia';
  document.getElementById('wrapMet').style.display = t==='despesa' ? '' : 'none';
  document.getElementById('fCat').innerHTML = (t==='receita'?CAT_RECEITA:CAT_DESPESA).map(c=>`<option>${c}</option>`).join('');
}
function abrirModal(t){
  setTipo(t);
  ['fValor','fDesc','pTitulo','pHora'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fData').value = hojeISO();
  document.getElementById('pData').value = hojeISO();
  document.getElementById('fMet').value = state.cfg.metodoPadrao;
  document.getElementById('modal').hidden = false;
  setTimeout(()=>document.getElementById(t==='pendencia'?'pTitulo':'fValor').focus(), 60);
}
document.getElementById('btnSalvar').onclick = ()=>{
  if(tipoModal==='pendencia'){
    const titulo = document.getElementById('pTitulo').value.trim();
    if(!titulo){ toast('Escreva o que é'); return; }
    state.pendencias.push({ id:uid(), titulo, data:document.getElementById('pData').value||hojeISO(), hora:document.getElementById('pHora').value||null, feito:false });
    toast('Pendência salva');
  } else {
    const valor = parseFloat(String(document.getElementById('fValor').value).replace(',','.'));
    if(!valor || valor<=0){ toast('Informe um valor'); return; }
    state.lancamentos.push({ id:uid(), tipo:tipoModal, valor,
      descricao:document.getElementById('fDesc').value.trim(),
      categoria:document.getElementById('fCat').value,
      metodo: tipoModal==='despesa' ? document.getElementById('fMet').value : 'conta',
      data:document.getElementById('fData').value||hojeISO() });
    toast(tipoModal==='receita'?'Entrada salva':'Gasto salvo');
  }
  document.getElementById('modal').hidden = true; salvar(); render();
};

/* ===================== ajustes ===================== */
document.getElementById('btnCfg').onclick = abrirCfg;
document.getElementById('cFechar').onclick = ()=> document.getElementById('modalCfg').hidden = true;
document.getElementById('modalCfg').onclick = e => { if(e.target.id==='modalCfg') e.target.hidden = true; };
document.getElementById('cAdd').onclick = ()=> addFixa('', '');
function abrirCfg(){
  document.getElementById('cSalario').value = state.cfg.salario;
  document.getElementById('cLimite').value = state.cfg.limite;
  document.getElementById('cTeto').value = state.cfg.tetoFds;
  document.getElementById('cSexta').value = state.cfg.sextaNoFds ? 'sim':'nao';
  document.getElementById('cFixas').innerHTML = '';
  (state.cfg.comprometido||[]).forEach(c=>addFixa(c.nome, c.valor));
  document.getElementById('cConta').textContent = modo==='nuvem'
    ? 'Sincronizando na nuvem como '+(user?.email||'—')
    : 'Modo local: os dados ficam só neste aparelho.';
  document.getElementById('modalCfg').hidden = false;
}
function addFixa(nome, valor){
  const div = document.createElement('div');
  div.className = 'fixa';
  div.innerHTML = `<input type="text" placeholder="nome" value="${esc(nome)}">
    <input type="number" step="0.01" placeholder="0,00" value="${valor===''?'':valor}">
    <button aria-label="Remover">×</button>`;
  div.querySelector('button').onclick = ()=> div.remove();
  document.getElementById('cFixas').appendChild(div);
}
document.getElementById('cSalvar').onclick = ()=>{
  state.cfg.salario = parseFloat(document.getElementById('cSalario').value)||0;
  state.cfg.limite  = parseFloat(document.getElementById('cLimite').value)||0;
  state.cfg.tetoFds = parseFloat(document.getElementById('cTeto').value)||0;
  state.cfg.sextaNoFds = document.getElementById('cSexta').value==='sim';
  state.cfg.comprometido = [...document.querySelectorAll('#cFixas .fixa')].map(d=>{
    const i = d.querySelectorAll('input');
    return { nome: i[0].value.trim()||'Item', valor: parseFloat(i[1].value)||0 };
  }).filter(x=>x.valor>0);
  document.getElementById('modalCfg').hidden = true; salvar(); render(); toast('Ajustes salvos');
};
document.getElementById('cExportar').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'painel-backup-'+hojeISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('cImportar').onclick = ()=> document.getElementById('cArquivo').click();
document.getElementById('cArquivo').onchange = async e => {
  const f = e.target.files?.[0]; if(!f) return;
  try{
    aplicarDoc(JSON.parse(await f.text()));
    salvarAgora(); render(); renderChat();
    document.getElementById('modalCfg').hidden = true; toast('Backup restaurado');
  }catch(err){ toast('Arquivo inválido'); }
};

/* ===================== toast ===================== */
let tToast;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(tToast); tToast = setTimeout(()=>t.hidden=true, 2800);
}

/* ===================== captura por texto (Groq) ===================== */
const entrada = document.getElementById('entrada');
entrada.addEventListener('input', ()=>{ entrada.style.height='auto'; entrada.style.height=Math.min(110,entrada.scrollHeight)+'px'; });
entrada.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } });
document.getElementById('btnEnviar').onclick = enviar;

function renderChat(){
  const log = document.getElementById('log');
  if(!state.chat.length){ log.hidden = true; log.innerHTML=''; return; }
  log.hidden = false;
  log.innerHTML = state.chat.slice(-12).map(m=>`<div class="msg ${m.de==='eu'?'eu':'ia'}${m.erro?' erro':''}">${esc(m.txt)}</div>`).join('')
    + '<button class="limpar" id="limparLog">limpar conversa</button>';
  const lb = document.getElementById('limparLog');
  if(lb) lb.onclick = ()=>{ state.chat=[]; salvar(); renderChat(); };
  log.scrollTop = log.scrollHeight;
}

async function enviar(){
  const txt = entrada.value.trim(); if(!txt) return;
  entrada.value=''; entrada.style.height='auto';
  state.chat.push({de:'eu', txt}); renderChat();
  const log = document.getElementById('log'); log.hidden = false;
  const load = document.createElement('div');
  load.className='pensando'; load.innerHTML='<i></i><i></i><i></i> lendo';
  log.appendChild(load); log.scrollTop = log.scrollHeight;
  document.getElementById('btnEnviar').disabled = true;

  let res;
  try{ res = await interpretar(txt); }
  catch(e){ res = fallback(txt); }
  finally{ load.remove(); document.getElementById('btnEnviar').disabled = false; }

  aplicar(res);
  state.chat.push({de:'ia', txt: res.resposta || 'Registrado.', erro: !!res.erro});
  salvar(); render(); renderChat();
}

function aplicar(res){
  (res.acoes||[]).forEach(a=>{
    if(a.tipo==='pendencia' && a.titulo){
      state.pendencias.push({ id:uid(), titulo:a.titulo, data:a.data||hojeISO(), hora:a.hora||null, feito:false });
    } else if((a.tipo==='despesa'||a.tipo==='receita') && Number(a.valor)>0){
      const cats = a.tipo==='receita'?CAT_RECEITA:CAT_DESPESA;
      state.lancamentos.push({ id:uid(), tipo:a.tipo, valor:Number(a.valor),
        descricao:a.descricao||'', data:a.data||hojeISO(),
        categoria: cats.includes(a.categoria)?a.categoria:'Outros',
        metodo: a.tipo==='despesa' ? (a.metodo==='conta'?'conta':state.cfg.metodoPadrao) : 'conta' });
    }
  });
}

async function interpretar(msg){
  if(!CONFIG.groq.key || CONFIG.groq.key.startsWith('COLE')) throw new Error('sem chave');
  const hoje = hojeISO(), ym = hoje.slice(0,7);
  const r = resumo(ym), p = projecao(ym), f = fdsDe(hoje);
  const ctx = {
    hoje, diaDaSemana: diaSemana(hoje),
    regras: { salario: state.cfg.salario, limitePicPay: state.cfg.limite, tetoPorFimDeSemana: state.cfg.tetoFds,
      metaMeioDeSemana: 'gastar zero', comprometidoProximoSalario: state.cfg.comprometido },
    situacao: { faturaPicPayAtual: r.credito, limiteLivre: state.cfg.limite - r.credito, gastoTotalMes: r.sai,
      gastoNesteFimDeSemana: gastoNoFds(f), fimDeSemanaAtual: f, livreNoProximoSalario: p.livre,
      orcamentoRestanteFinsDeSemana: orcamentoRestante(ym), diasSemGastar: streakLimpo() },
    gastosPorCategoria: porCategoria(ym),
    ultimosLancamentos: state.lancamentos.slice(-40).map(l=>({t:l.tipo,v:l.valor,d:l.descricao,c:l.categoria,m:l.metodo,data:l.data})),
    pendenciasAbertas: pendenciasAbertas().map(x=>({titulo:x.titulo,data:x.data,hora:x.hora}))
  };
  const sistema = `Você é o motor de um app pessoal de finanças e pendências, em português do Brasil.
Hoje é ${hoje} (${ctx.diaDaSemana}).
Devolva SOMENTE um objeto JSON: {"acoes":[],"resposta":"..."}

Ações possíveis:
{"tipo":"despesa","valor":38,"descricao":"ifood","categoria":"iFood","metodo":"picpay","data":"AAAA-MM-DD"}
{"tipo":"receita","valor":2875,"descricao":"salário","categoria":"Salário","data":"AAAA-MM-DD"}
{"tipo":"pendencia","titulo":"Reunião com Jamil","data":"AAAA-MM-DD","hora":"09:00"}

Regras:
- Categorias de despesa: ${CAT_DESPESA.join(', ')}. Gasto com a Nicolly vai em "Nicolly". Delivery vai em "iFood".
- Categorias de receita: ${CAT_RECEITA.join(', ')}.
- "metodo": "picpay" para crédito/cartão/PicPay (padrão, a conta fica zerada) ou "conta" para pix, débito e dinheiro.
- Uma mensagem pode gerar várias ações. Nada a registrar: "acoes" vazio.
- Resolva datas relativas em datas absolutas. Hora em 24h; omita se não houver.
- Pergunta sobre os dados: não crie ações, responda usando SITUACAO com valores em reais.
- "resposta": uma ou duas frases curtas. Ao registrar gasto, diga quanto resta do teto do fim de semana ou do limite livre. Sem emoji, sem sermão.

DADOS: ${JSON.stringify(ctx)}`;

  const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+CONFIG.groq.key },
    body: JSON.stringify({
      model: CONFIG.groq.model, temperature: 0.2, max_tokens: 900,
      response_format: { type: 'json_object' },
      messages: [ {role:'system', content:sistema}, {role:'user', content:msg} ]
    })
  });
  if(!resp.ok) throw new Error('http '+resp.status);
  const data = await resp.json();
  const texto = data.choices?.[0]?.message?.content || '';
  const limpo = texto.replace(/```json|```/g,'').trim();
  return JSON.parse(limpo.slice(limpo.indexOf('{'), limpo.lastIndexOf('}')+1));
}

function fallback(msg){
  const t = msg.toLowerCase(), m = t.match(/(\d+[.,]?\d*)/);
  const valor = m ? parseFloat(m[1].replace(',','.')) : 0;
  const receita = /recebi|entrou|salário|salario|caiu|pagaram/.test(t);
  const gasto = /gastei|paguei|comprei|ifood|uber|mercado|gasto/.test(t);
  if(valor > 0 && (gasto || receita)){
    return { acoes:[{ tipo: receita?'receita':'despesa', valor, descricao: msg.slice(0,60), categoria:'Outros',
      metodo: receita?'conta':state.cfg.metodoPadrao, data: hojeISO() }],
      resposta:'IA indisponível — registrei '+brl(valor)+' em Outros. Ajuste a categoria no "+" se precisar.', erro:true };
  }
  return { acoes:[], resposta:'Não consegui interpretar (IA indisponível ou offline). Use o botão "+".', erro:true };
}

/* ===================== service worker ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

iniciar();
render();
</script>
